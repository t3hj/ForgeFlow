services:
  frontend:
    build:
      context: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: postgresql://forgeflow:forgeflow@database:5432/forgeflow
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"
    depends_on:
      - database
      - redis

  worker:
    build:
      context: ./apps/worker
    environment:
      DATABASE_URL: postgresql://forgeflow:forgeflow@database:5432/forgeflow
      REDIS_URL: redis://redis:6379
    depends_on:
      - database
      - redis

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: forgeflow
      POSTGRES_USER: forgeflow
      POSTGRES_PASSWORD: forgeflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
